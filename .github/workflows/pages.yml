# Publish the site to GitHub Pages.
#
# This does not build anything. The gh-pages branch already carries a built
# copy, so this job only has to hand those files to Pages — no Node, no npm, no
# lockfile, nothing that can fail for a reason unrelated to the site itself.
# An earlier version built from source here and failed in a way whose logs were
# not reachable, which is exactly the dependency worth removing.
#
# configure-pages with enablement turns Pages on by itself, so nobody has to
# find a setting in the web UI.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/monterosa-ski-app-aeb8ex, gh-pages, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the built site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      # The artifact is the folder as-is; its own git metadata is not part of
      # the site.
      - name: Drop git metadata
        run: rm -rf site/.git

      - name: Turn Pages on if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
