# Build the app and publish it to GitHub Pages.
#
# Deployed through the Pages artifact API rather than by committing the build
# to the gh-pages branch, and the reason is the MapTiler key.
#
# A frontend map key is public by necessity — it is handed to every browser
# that loads the map, and no amount of care changes that. What it must not be
# is *committed*, because a key in git history outlives the deploy, survives a
# rotation nobody remembers to do, and is scraped from public repositories by
# people who do this for a living. Uploading an artifact publishes the built
# bundle without writing it to a branch, so the key reaches the live site and
# never reaches the repository.
#
# This replaces the hand-copied gh-pages branch, which could not carry a key
# for that reason and so could only ever serve the schematic terrain. Pages
# serves from a branch *or* from an artifact, never both, so the branch is
# deliberately not updated by anything any more: two mechanisms disagreeing
# shows up only as a 404, which is a miserable thing to debug.
#
# Requires, once: Settings -> Pages -> Source: GitHub Actions.
# And the key at Settings -> Secrets and variables -> Actions, as
# VITE_MAPTILER_KEY. Without it everything still builds and deploys, and the
# map falls back to the terrain view.
#
# Restrict the key to this site's origin at cloud.maptiler.com. That is the
# only protection that means anything for a key a browser can read.
name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/monterosa-ski-app-aeb8ex
    # None of these change the deployed site.
    paths-ignore:
      - '**.md'
      - 'ios-setup/**'
      - 'data/**'

permissions:
  contents: read
  pages: write
  id-token: write

# One at a time, and never cancelled halfway: a cancelled Pages deployment can
# leave the site on the old build with the new one stuck as in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The same gate the resort workflow uses. A broken solver should not
      # reach a phone on a mountain.
      - run: npm test

      - name: Build
        env:
          # Project pages are served from /<repo>/, so every asset URL and the
          # service worker scope need the prefix. Derived rather than typed, so
          # renaming the repository cannot silently break the deploy.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
        run: |
          npm run build
          # Pages serves 404.html for a path it has no file for. The app keeps
          # its state in memory rather than in the URL, so this is only
          # insurance against a stale bookmark — but a blank page on a phone in
          # a lift queue is worth one copied file.
          cp dist/index.html dist/404.html
          # Without this Pages runs the output through Jekyll, which drops
          # anything beginning with an underscore.
          touch dist/.nojekyll
          # Which commit this build is, in a file small enough to fetch from
          # the live site afterwards. See "Check the site is actually this
          # build" below for why that turned out to be necessary.
          echo "${GITHUB_SHA}" > dist/version.txt

      - name: Say whether satellite will work
        env:
          KEY: ${{ secrets.VITE_MAPTILER_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'MapTiler key present: Satellite and Winter map are live, and Satellite is the default.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### No MapTiler key'
              echo
              echo 'Terrain works. Satellite and Winter map will show their "needs a key" state.'
              echo 'Add `VITE_MAPTILER_KEY` under Settings -> Secrets and variables -> Actions, then re-run this workflow.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # enablement, so the Pages source does not have to be switched by hand.
      #
      # Pages serves from a branch or from a workflow artifact, and the repo
      # setting decides which. This one was on the branch, so the first run of
      # this workflow would have built the site, uploaded it, and then failed
      # at the deploy step with "Pages is not configured for GitHub Actions" —
      # a red X and a stale site, waiting on a click in Settings.
      #
      # `enablement` makes the action set build_type to workflow itself, using
      # the pages: write permission already granted above. If it cannot, the
      # job fails exactly where it would have failed anyway and Pages carries
      # on serving the branch, so this costs nothing to try.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Did any of that reach the internet?
      #
      # This workflow was green for days while the live site served a build
      # from a fortnight earlier, because the repository's Pages source was
      # still "deploy from a branch" and the stale gh-pages branch was what
      # visitors got. Every run built the app, ran the tests, uploaded the
      # artifact and deployed it, and every run was ignored. Nothing anywhere
      # said so. It was found by a person reading the wordmark on their phone
      # and saying, three times, that it was the old one.
      #
      # A deployment that does not change what a visitor sees is a failed
      # deployment, whatever the API returned, so this asks the site. The file
      # is thirty bytes and the answer is unambiguous: either the sha at the
      # published URL is this commit or the deploy went somewhere nobody is
      # looking.
      #
      # Retried, because the edge takes a few seconds to pick up a new
      # deployment and a false red here would be its own kind of noise.
      - name: Check the site is actually this build
        env:
          PAGE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            live=$(curl -fsS --max-time 20 "${PAGE}version.txt?cachebust=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live at ${PAGE} is ${GITHUB_SHA}."
              exit 0
            fi
            echo "Attempt ${attempt}: ${PAGE} reports '${live:-nothing}', expected ${GITHUB_SHA}."
            sleep $((attempt * 10))
          done
          {
            echo '### The deploy did not reach the site'
            echo
            echo "The workflow built and deployed \`${GITHUB_SHA}\`, and ${PAGE} is still serving"
            echo "\`${live:-something else}\`."
            echo
            echo 'The usual cause is the Pages source: Settings -> Pages -> Build and deployment'
            echo 'must be **GitHub Actions**, not "Deploy from a branch". While it is set to a'
            echo 'branch, every run here succeeds and every result is discarded.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
