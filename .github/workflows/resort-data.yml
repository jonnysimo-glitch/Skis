# Fetch a resort's OpenStreetMap data and build its graph.
#
# This exists because the machine the app is developed on cannot reach
# overpass-api.de: the network policy answers 403 at the CONNECT, on every
# public mirror, and on api.openstreetmap.org and download.geofabrik.de too.
# A GitHub runner has no such policy, so the fetch happens here and the result
# is committed back. Adding a resort is then a config file and a button.
#
# Not on push. Overpass is a volunteer service and running a full extraction on
# every commit would be rude and slow; it is asked only when someone asks.
name: Resort data

on:
  workflow_dispatch:
    inputs:
      resorts:
        description: 'Which resorts, space separated. Blank does every config in scripts/resorts/.'
        required: false
        default: ''
      tolerance:
        description: 'Stitching tolerance in metres. Blank uses each config own value.'
        required: false
        default: ''
  # Once a month, because OSM is edited continuously and a resort that gained a
  # lift last season should not need someone to remember.
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: write

concurrency:
  group: resort-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Elevation tiles are fetched per resort and are large. Caching them
      # keeps a re-run to the Overpass call, and keeps the load off a public
      # bucket that owes us nothing.
      - name: Cache elevation tiles
        uses: actions/cache@v4
        with:
          path: data/dem
          key: dem-${{ hashFiles('scripts/resorts/*.json') }}
          restore-keys: dem-

      # The inputs arrive through env rather than ${{ }} inside the script:
      # interpolating them into the shell would let a dispatch value run as
      # code on the runner.
      - name: Fetch and build
        id: fetch
        env:
          RESORTS: ${{ github.event.inputs.resorts }}
          TOLERANCE: ${{ github.event.inputs.tolerance }}
        run: |
          set -o pipefail
          ARGS="$RESORTS"
          if [ -z "$ARGS" ]; then ARGS="--all"; fi
          if [ -n "$TOLERANCE" ]; then ARGS="$ARGS --tolerance=$TOLERANCE"; fi
          echo "npm run resort -- $ARGS"
          # Deliberately not failing the step. With three resorts, one Overpass
          # timeout must not throw away the two that worked — the commit step
          # below would never run and the whole twenty-minute fetch would have
          # to be repeated. The outcome is carried to the last step, which
          # fails the job after the good data is safely committed.
          if npm run resort -- $ARGS 2>&1 | tee resort-run.log; then
            echo "failed=0" >> "$GITHUB_OUTPUT"
          else
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
          # The report says how much stitching each graph needed, which is the
          # number that tells you whether to trust it. On the run page, so it
          # does not need an artifact download to read.
          {
            echo '## Resort data'
            echo
            echo '```'
            cat resort-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The raw exports go first, before anything can fail.
      #
      # Asking Overpass is the slow and rude part of this job; building a graph
      # from what it sent is fast and repeatable. An export is an input, so it
      # is safe to keep whatever the build then makes of it — and if the build
      # refuses the graph, having the export on the branch means the next
      # attempt is a local `--offline` build instead of another twenty minutes
      # of someone else's donated hardware. The first time the build failed
      # this way the export survived only because it had been committed before
      # the graph existed at all.
      - name: Bank the raw exports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git does not track empty directories, so data/osm does not survive
          # a clone. Without this, `git add` on a run that fetched nothing
          # fails on the pathspec and reports a red X for a no-op.
          mkdir -p data/osm
          git add data/osm
          if git diff --cached --quiet; then
            echo "No new or changed export."
            exit 0
          fi
          git commit -m "OpenStreetMap exports for the resort graphs

          The raw Overpass responses, committed before the graphs are built so
          a refused graph does not cost another fetch.
          Run: ${{ github.run_id }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "$BRANCH" || exit 1
          done
          exit 1

      # Gates the graphs, not the exports. scripts/check-resorts.mjs loads
      # every generated module and asks the solver to plan a real day on it,
      # which is what catches a mountain stitched into two halves. It also
      # fails when an export has no graph beside it — which is now an expected
      # state rather than an impossible one, so this step is where that shows
      # up, with the export already safe on the branch.
      - name: Check nothing broke
        run: npm test

      - name: Commit the graphs
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p src/resorts
          git add src/resorts
          if git diff --cached --quiet; then
            echo "No change: the graphs are the same as last time."
            exit 0
          fi
          git commit -m "Resort graphs from OpenStreetMap

          Built by .github/workflows/resort-data.yml from the exports in
          data/osm.
          Run: ${{ github.run_id }}"
          # A push can lose a race with someone pushing to the same branch.
          # Rebase and retry rather than making a person re-run the fetch.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "$BRANCH" || exit 1
          done
          exit 1

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resort-report
          path: |
            resort-run.log
            data/osm/*.json
            src/resorts/*.js
          if-no-files-found: warn
          retention-days: 14

      # Last, so a partial failure is still visibly red without having cost
      # the resorts that did build.
      - name: Report a resort that did not build
        if: steps.fetch.outputs.failed == '1'
        run: |
          echo "At least one resort did not build. The log is in the run summary above."
          echo "Anything that did build has been committed; re-run for the rest."
          exit 1
