<!--
  Two peaks, and the line down one of them.

  The same shape as the Mountain glyph the app uses in its tab bar and its
  resort bar, so the icon is that family's largest member rather than a
  separate drawing: a small peak on the left, a bigger one on the right, drawn
  as open strokes. One flank carries the glacier accent, and that is the whole
  idea — the route is a face of the mountain, not something laid over the top
  of it. The mark it replaces was a filled silhouette with a cyan squiggle
  across the foot of it, which read as water rather than as a piste and turned
  to mush below about 24 pixels.

  Stroke 5.8 in this 64 unit grid, chosen by rendering 4.6 through 6.4 at 120,
  60, 32, 20 and 16 pixels and looking: thinner and the accent flank vanishes
  at favicon size, thicker and the two peaks start to merge at their join.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153140"/>
      <stop offset="1" stop-color="#08131b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#plate)"/>
  <g fill="none" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 44 L23 27 L29 36" stroke="#e9f2f7"/>
    <path d="M39 24 L52 44" stroke="#e9f2f7"/>
    <path d="M26 44 L39 24" stroke="#2ac4ee"/>
  </g>
</svg>
